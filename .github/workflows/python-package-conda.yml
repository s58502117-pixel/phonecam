name: Build PhoneCam APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with Buildozer
        run: |
          docker run --rm -v "$PWD":/home/user/hostcwd kivy/buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCam-APK
          path: bin/*.apk
